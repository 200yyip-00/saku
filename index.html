<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width = device-width, initial-scale=1, user-scalable=yes" />
	<link rel="stylesheet" href="assets/css/normalize.css">
	<link rel="stylesheet" href="assets/css/common.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<title>aaaaaa</title>
</head>

<body>
	<div class="title">
		<h1>サクコイポイントシミュレーター</h1>
		<p>抽選券とか獲得プラン</p>
	</div>

	<div class="form-area">
		<form action="">
			<div class="form-parts">
				<label for="total" class="pars-head">必要pt</label>
				<input type="number" step="500000" value="0">
			</div>
			<div class="form-parts">
				<label for="total" class="pars-head">現在のpt</label>
				<input type="number" step="500000" value="0">
			</div>
			<div class="form-date-wrap">
				<p>獲得日数</p>
				<div class="form-date">
					<div class="form-parts"><label for="date">1週目</label>
						<select name="" id="">
							<option value="0">0</option>
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
							<option value="5">5</option>
							<option value="6">6</option>
							<option value="7">7</option>
							<option value="8">8</option>
						</select>
					</div>
					<div class="form-parts"><label for="date">2週目</label>
						<select name="" id="">
							<option value="1">0</option>
							<option value="1">1</option>
							<option value="2">2</option>
							<option value="3">3</option>
							<option value="4">4</option>
							<option value="5">5</option>
							<option value="6">6</option>
							<option value="7">7</option>
							<option value="8">8</option>
						</select>
					</div>
				</div>
			</div>
			<div class="form-menber-wrap">
<p></p>
		<div class="form-menber-parts">
	<div class="form-menber">
				<label for="menber">参加メンバー</label>
				<select name="" id="">
					<option value="" selected disabled>選ぶのよ</option>
					<option value="">12人</option>
					<option value="">13人</option>
					<option value="">14人</option>
					<option value="">15人</option>
					<option value="">16人</option>
				</select>
			</div>
		
			<div class="form-menber"><label for="menber">推しメン人数(pt+10%)</label>
				<select name="" id="">
					<option value="">0</option>
					<option value="">1</option>
					<option value="">2</option>
					<option value="">3</option>
					<option value="">4</option>
					<option value="">5</option>
					<option value="">6</option>
					<option value="">7</option>
					<option value="">8</option>
					<option value="">9</option>
					<option value="">10</option>
					<option value="">11</option>
					<option value="">12</option>
					<option value="">13</option>
					<option value="">14</option>
					<option value="">15</option>
					<option value="">16</option>
				</select>
			</div>
			</div>
			</div>
			<div class="form-parts">
				<label for="bonus" class="pars-head">所持ボーナス(%)</label>
				<input type="number" step="100" max="260" placeholder="推しメン+10%を除いたボーナス値">
			</div>
			<div class="form-parts">
				<label for="item" class="pars-head">メダル枚数</label>
				<input type="number">
			</div>
				<div class="form-parts">
				<label for="item" class="pars-head">花束</label>
				<input type="number" placeholder="luckyボーナスの点数から計算">
			</div>
		</form>
	</div>
</body>

</html>
